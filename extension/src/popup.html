<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FlipFinder for Vinted</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      body { width: 320px; padding: 14px; }
      header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
      .stack { display: grid; gap: 8px; }
      .stack .btn { width: 100%; }
      .state { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); margin-bottom: 10px; font-size: 13px; }
      .links { display: flex; justify-content: space-between; margin-top: 10px; }
      .links button { all: unset; cursor: pointer; color: var(--accent); font-size: 12px; }
      .links button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <header>
      <span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg></span>
      <div class="grow">
        <h1 style="font-size:15px">FlipFinder for Vinted</h1>
        <p class="muted" id="sub">Legge solo le pagine che apri tu.</p>
      </div>
    </header>
    <div class="state" role="status"><span id="state">…</span><span class="pill" id="pending" hidden></span></div>
    <div class="stack">
      <button class="btn primary" id="panel" type="button">Apri il pannello live</button>
      <button class="btn" id="analyze" type="button">Apri questa pagina in FlipFinder</button>
      <p class="status" id="status" role="status"></p>
    </div>
    <div class="links">
      <button id="app" type="button">Apri FlipFinder</button>
      <button id="options" type="button">Opzioni</button>
    </div>
    <script src="core.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
